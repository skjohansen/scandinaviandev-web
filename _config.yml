# ScandinavianDev — Jekyll config (GitHub Pages)
# Restart `bundle exec jekyll serve` after editing this file.

title: ScandinavianDev
wordmark: Scandinavian Dev
tagline: Software, designed the Scandinavian way
description: >-
  Scandinavian Dev builds software the way Scandinavian design builds
  furniture: minimal, purposeful, made to last. All four quality
  characteristics of software share one goal — better software — and the
  goal of security is resilience. We upskill the engineers you already have:
  product security training, security champions, tabletop exercises,
  fractional CISO and security due diligence for European product teams.
url: "https://scandinavian.dev"
logo: /assets/images/logo-512.png      # search engines (structured data)
baseurl: ""
lang: en          # UI strings come from _data/i18n/<lang>.yml
locale: en_GB

author:
  name: Stephan Johansen

# Booking link used by every "Book a call" / "Schedule via Calendly" button
calendly_url: "https://calendly.com/scandinavian-dev"

# Used in footer and contact page
contact:
  email: info@scandinavian.dev
  phone: "+45 40 92 54 33"
  phone_href: "+4540925433"
  company: Nonsultant AB
  street: Åkerstigen 72A
  postcode: "532 38"
  city: Skara
  country: Sweden

# Legal information panel on /contact/ (design 08-about-contact)
legal:
  name: Nonsultant AB
  trading_as: Scandinavian dev
  org_number: 559217-2703
  vat_number: SE559217270301
  ceo: Stephan Kaas Johansen

# No remote/default theme: all styling lives in assets/css/
theme: null

permalink: pretty
markdown: kramdown

# Offerings: one file per offering in _offerings/, sorted by `order`
# Quality parameters: one information page per quality characteristic
collections:
  offerings:
    output: true
    permalink: /offerings/:name/
  quality:
    output: true
    permalink: /quality/:name/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from   # `redirect_from:` in front matter (old URLs)

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/og-image.png   # share thumbnail (LinkedIn, Slack, etc.)
  - scope:
      path: ""
      type: offerings
    values:
      layout: offering
  - scope:
      path: ""
      type: quality
    values:
      layout: quality

exclude:
  - Gemfile
  - Gemfile.lock
  - Dockerfile
  - docker-compose.yml
  - .devcontainer
  - README.md
  - CHANGELOG.md
  - CLAUDE.md
  - docs/
  - vendor/
  - node_modules/
