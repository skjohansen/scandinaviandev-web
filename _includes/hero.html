<section class="hero">
  <div class="container">
    <div class="hero__content">
      {% if include.label %}<span class="hero__label">{{ include.label }}</span>{% endif %}
      <h1>{{ include.title }}</h1>
      {% if include.text %}<p>{{ include.text }}</p>{% endif %}
      {% if include.cta_url %}
      <div class="hero__actions">
        <a href="{{ include.cta_url }}" class="btn btn-primary">{{ include.cta_text }}</a>
        {% if include.cta2_url %}
        <a href="{{ include.cta2_url }}" class="btn btn-outline">{{ include.cta2_text }}</a>
        {% endif %}
      </div>
      {% endif %}
    </div>
  </div>
</section>
