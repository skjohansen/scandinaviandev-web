<header class="site-header">
  <div class="container site-header__inner">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.wordmark }}</a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav"
            aria-label="{{ t.menu_open }}" data-label-open="{{ t.menu_open }}" data-label-close="{{ t.menu_close }}">
      <span class="nav-toggle__open">{% include icon.html name="menu" %}</span>
      <span class="nav-toggle__close">{% include icon.html name="close" %}</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="{{ t.nav_label }}">
      <ul class="site-nav__list">
        {% for item in site.data.navigation %}
          {% assign active = false %}
          {% if page.url == item.url or page.url contains item.url %}{% assign active = true %}{% endif %}
          <li>
            <a class="site-nav__link{% if active %} is-active{% endif %}" href="{{ item.url | relative_url }}"
               {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.title }}</a>
          </li>
        {% endfor %}
      </ul>
      <a class="btn btn--primary btn--sm site-nav__cta" href="{{ site.calendly_url }}" target="_blank" rel="noopener">{{ t.book_intro_call }}</a>
    </nav>
  </div>
</header>
