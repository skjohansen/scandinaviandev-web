{%- comment -%}
  Vector redraw of the Fractional CISO illustration: a risk-based
  governance framework. Fewer, larger labels than the mockup so text stays
  legible when scaled down.
{%- endcomment -%}
<svg class="illustration" viewBox="0 0 800 600" role="img" aria-labelledby="ciso-title" xmlns="http://www.w3.org/2000/svg">
  <title id="ciso-title">Risk-based governance framework: the CISO escalates risk to senior management and the board, turns security assessments into executive reports, and maps NIS2 and GDPR obligations into continuous risk monitoring</title>
  <defs>
    <marker id="ciso-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1D4ED8"/>
    </marker>
    <marker id="ciso-arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9AAAC2"/>
    </marker>
    <symbol id="ciso-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></symbol>
    <symbol id="ciso-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="ciso-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></symbol>
    <symbol id="ciso-doc" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="m9 15 2 2 4-4"/></symbol>
    <symbol id="ciso-chart" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
  </defs>

  <rect width="800" height="600" fill="#F6F8FB"/>
  <rect x="20" y="20" width="760" height="560" rx="14" fill="#FBFCFD" stroke="#C9D3E1" stroke-width="1.5"/>

  <!-- Board -->
  <rect x="344" y="38" width="112" height="46" rx="6" fill="#FFFFFF" stroke="#9AAAC2" stroke-width="1.5"/>
  <use href="#ciso-users" x="386" y="47" width="28" height="28" fill="none" stroke="#6B7FA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="none" stroke="#9AAAC2" stroke-width="1.3"><path d="M362 61l5-5 5 5-5 5zM428 61l5-5 5 5-5 5z"/></g>

  <!-- Reporting levels -->
  <rect x="70" y="100" width="660" height="30" rx="4" fill="#EBF0F6"/>
  <text x="400" y="120" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.4" fill="#4B5B75">LEVEL 1 · BOARD REPORTING &amp; OVERSIGHT</text>
  <rect x="44" y="142" width="712" height="30" rx="4" fill="#F1F4F8"/>
  <text x="64" y="162" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#5B6A82">LEVEL 2 · SENIOR MANAGEMENT</text>

  <!-- Escalation up from CISO -->
  <g stroke="#9AAAC2" stroke-width="1.5" fill="none">
    <path d="M400 196V92" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M631 198v-18" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M169 198v-18" marker-end="url(#ciso-arrow-grey)"/>
  </g>

  <!-- Assessment and briefing boxes -->
  <g fill="#FFFFFF" stroke="#9AAAC2" stroke-width="1.5">
    <rect x="56" y="198" width="226" height="44" rx="5"/>
    <rect x="518" y="198" width="226" height="44" rx="5"/>
  </g>
  <g fill="none" stroke="#6B7FA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <use href="#ciso-doc" x="70" y="208" width="24" height="24"/>
    <use href="#ciso-users" x="532" y="208" width="24" height="24"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="0.6" fill="#3E4C63">
    <text x="104" y="225">SECURITY ASSESSMENT</text>
    <text x="566" y="225">BOARD BRIEFING</text>
  </g>
  <g stroke="#B5C2D4" stroke-width="1.3" fill="none">
    <path d="M282 208l68 10" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M282 226l68 8" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M518 208l-68 10" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M518 226l-68 8" marker-end="url(#ciso-arrow-grey)"/>
  </g>

  <!-- CISO risk escalation (centre) -->
  <circle cx="400" cy="236" r="40" fill="none" stroke="#DCE5F5" stroke-width="1.5"/>
  <use href="#ciso-shield" x="370" y="206" width="60" height="60" fill="#DBE5FB" stroke="#1D4ED8" stroke-width="1.4" stroke-linejoin="round"/>
  <g stroke="#1D4ED8" stroke-width="1.8" fill="none"><path d="M400 228l-9 10M400 228l9 10M400 228v-6"/></g>
  <g fill="#1D4ED8"><circle cx="400" cy="221" r="3.2"/><circle cx="390" cy="240" r="3.2"/><circle cx="410" cy="240" r="3.2"/></g>
  <text x="400" y="292" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#13233A">CISO RISK</text>
  <text x="400" y="306" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="600" letter-spacing="0.8" fill="#5B6A82">ESCALATION PATHWAY</text>

  <!-- Blue reporting path -->
  <g fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M610 326H196" marker-end="url(#ciso-arrow)"/>
    <path d="M572 326v-56a8 8 0 0 0-8-8h-116" marker-end="url(#ciso-arrow)"/>
    <path d="M400 358v-26"/>
  </g>
  <circle cx="400" cy="326" r="4.5" fill="#1D4ED8"/>

  <!-- CISO roles -->
  <g fill="#FFFFFF" stroke="#9AAAC2" stroke-width="1.5">
    <circle cx="160" cy="326" r="24"/>
    <circle cx="640" cy="326" r="24"/>
    <circle cx="400" cy="378" r="20"/>
  </g>
  <g fill="none" stroke="#6B7FA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <use href="#ciso-shield" x="148" y="314" width="24" height="24"/>
    <use href="#ciso-chart" x="628" y="314" width="24" height="24"/>
    <use href="#ciso-user" x="390" y="368" width="20" height="20"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#3E4C63" text-anchor="middle">
    <text x="160" y="368">CISO ASSESSMENT</text>
    <text x="640" y="368">EXECUTIVE REPORT</text>
    <text x="400" y="416">EXECUTIVE SUMMARY</text>
  </g>

  <!-- NIS2 obligations -->
  <text x="60" y="398" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#13233A">NIS2</text>
  <g fill="#FFFFFF" stroke="#9AAAC2" stroke-width="1.4">
    <rect x="60" y="410" width="214" height="32" rx="4"/>
    <rect x="60" y="450" width="214" height="32" rx="4"/>
    <rect x="60" y="490" width="214" height="32" rx="4"/>
  </g>
  <g fill="#E6ECF5" stroke="#9AAAC2" stroke-width="1.2">
    <rect x="70" y="418" width="16" height="16" rx="3"/><rect x="70" y="458" width="16" height="16" rx="3"/><rect x="70" y="498" width="16" height="16" rx="3"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#3E4C63">
    <text x="96" y="431">Governance, risk &amp; audit</text>
    <text x="96" y="471">Incident reporting</text>
    <text x="96" y="511">Security measures</text>
  </g>

  <!-- GDPR obligations -->
  <text x="740" y="398" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#13233A">GDPR</text>
  <g fill="#FFFFFF" stroke="#9AAAC2" stroke-width="1.4">
    <rect x="526" y="410" width="214" height="32" rx="4"/>
    <rect x="526" y="450" width="214" height="32" rx="4"/>
    <rect x="526" y="490" width="214" height="32" rx="4"/>
  </g>
  <g fill="#E6ECF5" stroke="#9AAAC2" stroke-width="1.2">
    <rect x="536" y="418" width="16" height="16" rx="3"/><rect x="536" y="458" width="16" height="16" rx="3"/><rect x="536" y="498" width="16" height="16" rx="3"/>
  </g>
  <g font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500" fill="#3E4C63">
    <text x="562" y="431">Legal &amp; regulatory</text>
    <text x="562" y="471">Data protection</text>
    <text x="562" y="511">Breach notification</text>
  </g>

  <!-- Risk monitoring -->
  <g stroke="#9AAAC2" stroke-width="1.4" fill="none">
    <path d="M274 466h86" marker-end="url(#ciso-arrow-grey)"/>
    <path d="M526 466h-86" marker-end="url(#ciso-arrow-grey)"/>
  </g>
  <circle cx="400" cy="474" r="26" fill="none" stroke="#E4E9F0" stroke-width="1.5"/>
  <use href="#ciso-shield" x="382" y="456" width="36" height="36" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M393 476l5 4 9-9" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="400" y="516" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#3E4C63">RISK MONITORING</text>

  <!-- Framework title -->
  <path d="M60 538v8h680v-8" fill="none" stroke="#C9D3E1" stroke-width="1.3"/>
  <text x="400" y="566" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.6" fill="#13233A">RISK-BASED GOVERNANCE FRAMEWORK</text>
</svg>
