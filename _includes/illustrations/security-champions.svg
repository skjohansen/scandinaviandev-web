{%- comment -%}
  Vector redraw of the Security Champions illustration.
  Teams and tools connected in one network around a security shield;
  blue lines are the champions' direct links.
{%- endcomment -%}
<svg class="illustration" viewBox="0 0 800 600" role="img" aria-labelledby="ch-title" xmlns="http://www.w3.org/2000/svg">
