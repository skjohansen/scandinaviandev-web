{%- comment -%}
  Icon sprite for the offerings path (one icon per offering).
  Include once per page; reference with <use href="#path-icon-<name>"/>.
  Stroke and colour come from the <use> element.
{%- endcomment -%}
<svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <!-- Foundation: graduation cap -->
  <symbol id="path-icon-training" viewBox="0 0 24 24">
    <path d="M12 5 2 9.5 12 14l10-4.5z"/>
    <path d="M6 11.6V16c0 1.4 2.7 2.6 6 2.6s6-1.2 6-2.6v-4.4"/>
    <path d="M20.5 10.2V15"/>
    <path d="M20.5 15c-.6.4-.8 1.2-.6 1.9l.6 1.6.6-1.6c.2-.7 0-1.5-.6-1.9z"/>
  </symbol>
  <!-- People: high-visibility safety vest with a shield badge -->
  <symbol id="path-icon-champions" viewBox="0 0 24 24">
    <path d="M8.5 3 6 4.2c0 2.6-.6 4.4-1.5 5.5V20a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1V9.7c-.9-1.1-1.5-2.9-1.5-5.5L15.5 3 12 9.6z"/>
    <path d="M12 9.6V21"/>
    <path d="M4.5 14h15M4.5 17h15"/>
    <path d="M14.4 8.2 15.6 7.7l1.2.5v1c0 .8-.5 1.4-1.2 1.7-.7-.3-1.2-.9-1.2-1.7z"/>
  </symbol>
  <!-- Practice: dumbbell -->
  <symbol id="path-icon-tabletop" viewBox="0 0 24 24">
    <rect x="4.5" y="6.5" width="2.6" height="11" rx="0.8"/>
    <rect x="16.9" y="6.5" width="2.6" height="11" rx="0.8"/>
    <rect x="2.4" y="9" width="2.1" height="6" rx="0.6"/>
    <rect x="19.5" y="9" width="2.1" height="6" rx="0.6"/>
    <path d="M7.1 10.6h9.8M7.1 13.4h9.8"/>
  </symbol>
  <!-- Governance: shield over an open map -->
  <symbol id="path-icon-ciso" viewBox="0 0 24 24">
    <path d="M12 2.5 7.5 4v3.6c0 3.4 2 5.4 4.5 6.7 2.5-1.3 4.5-3.3 4.5-6.7V4z"/>
    <path d="M12 5 9.6 5.8v1.9c0 1.9 1 3 2.4 3.8 1.4-.8 2.4-1.9 2.4-3.8V5.8z"/>
    <path d="M6.2 11.5 4 20.5l4.5-1 3.5 1 3.5-1 4.5 1-2.2-9"/>
    <path d="M8.5 15.2v4.3M15.5 15.2v4.3"/>
  </symbol>
  <!-- Growth: speed gauge -->
  <symbol id="path-icon-diligence" viewBox="0 0 24 24">
    <path d="M5.3 18.7a9.5 9.5 0 1 1 13.4 0"/>
    <path d="M12 3.5v2M3.5 13h2M18.5 13h2"/>
    <circle cx="12" cy="14" r="1.7"/>
    <path d="m13.2 12.8 4.3-5"/>
  </symbol>
</svg>
