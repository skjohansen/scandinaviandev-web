{%- comment -%}
  Vector redraw of the SDLC pipeline illustration.
  Inline SVG so it stays sharp at any size. Colours match tokens.css.
  Stages: design → code → review → secure → test → package → release,
  with a security feedback loop underneath.
{%- endcomment -%}
<svg class="illustration" viewBox="0 0 740 400" role="img" aria-labelledby="sdlc-title" xmlns="http://www.w3.org/2000/svg">
  <title id="sdlc-title">Software lifecycle from design, code, review and security to test, package and release, with a security feedback loop running underneath</title>
  <defs>
    <pattern id="sdlc-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE3EC"/>
    </pattern>
  </defs>

  <rect width="740" height="400" fill="#F6F8FB"/>
  <rect width="740" height="400" fill="url(#sdlc-dots)" opacity="0.6"/>

  <!-- Faint vertical guides above each stage, with small "document" glyphs -->
  <g stroke="#D3DBE6" stroke-width="1" fill="none">
    <path d="M70 168V70M165 168V50M265 168V80M370 168V40M475 168V70M575 168V55M670 168V85"/>
    <path d="M70 232v110M265 232v80M475 232v80M670 232v110" stroke-dasharray="2 4"/>
  </g>
  <g fill="#C3CEDD">
    <rect x="158" y="38" width="14" height="14" rx="2"/>
    <rect x="273" y="76" width="22" height="2"/><rect x="273" y="82" width="16" height="2"/><rect x="273" y="88" width="20" height="2"/>
    <rect x="483" y="66" width="22" height="2"/><rect x="483" y="72" width="14" height="2"/><rect x="483" y="78" width="18" height="2"/>
    <rect x="583" y="50" width="22" height="2"/><rect x="583" y="56" width="16" height="2"/>
    <circle cx="370" cy="40" r="3"/><circle cx="70" cy="70" r="2.5"/><circle cx="670" cy="85" r="2.5"/>
  </g>
  <circle cx="390" cy="62" r="4" fill="#1D4ED8"/>

  <!-- Main pipeline -->
  <g stroke="#1D4ED8" stroke-width="2" stroke-linecap="round">
    <path d="M18 200h22M100 200h35M195 200h40M295 200h45M400 200h45M505 200h40M605 200h35M700 200h22"/>
  </g>
  <g fill="#1D4ED8">
    <circle cx="18" cy="200" r="3"/><circle cx="722" cy="200" r="3"/>
    <circle cx="135" cy="200" r="3"/><circle cx="235" cy="200" r="3"/><circle cx="340" cy="200" r="3"/>
    <circle cx="445" cy="200" r="3"/><circle cx="545" cy="200" r="3"/><circle cx="640" cy="200" r="3"/>
  </g>

  <!-- Security feedback loop -->
  <path d="M165 232c10 30 30 48 70 48h270c40 0 60-18 70-48" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round"/>
  <path d="M370 232v58" stroke="#93A9D6" stroke-width="1.5" stroke-dasharray="3 4"/>
  <g fill="#B6C2D4">
    <circle cx="315" cy="322" r="2"/><circle cx="327" cy="322" r="2"/><circle cx="339" cy="322" r="2"/>
    <circle cx="401" cy="322" r="2"/><circle cx="413" cy="322" r="2"/><circle cx="425" cy="322" r="2"/>
  </g>

  <!-- Stage nodes -->
  <g fill="#FFFFFF" stroke="#C9D3E1" stroke-width="1.5">
    <circle cx="70" cy="200" r="38" fill="none" stroke="#E4E9F0"/>
    <circle cx="70" cy="200" r="28"/>
    <circle cx="165" cy="200" r="28"/>
    <circle cx="265" cy="200" r="28"/>
    <circle cx="475" cy="200" r="28"/>
    <circle cx="575" cy="200" r="28"/>
    <circle cx="670" cy="200" r="28"/>
    <circle cx="370" cy="200" r="38" fill="none" stroke="#DCE5F5"/>
    <circle cx="370" cy="322" r="34" fill="none" stroke="#E4E9F0"/>
    <circle cx="370" cy="322" r="24"/>
  </g>
  <circle cx="370" cy="200" r="28" fill="#FFFFFF" stroke="#1D4ED8" stroke-width="2.5"/>

  <!-- Icons (Lucide, 24-unit paths scaled to 20px) -->
  <g fill="none" stroke="#6B7FA3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(58 188)"><path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.4 2.6a2 2 0 0 1 3 3L12 15l-4 1 1-4Z"/></g>
    <g transform="translate(153 188)"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/><path d="m14.5 4-5 16"/></g>
    <g transform="translate(253 188)"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g>
    <g transform="translate(463 188)"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="m9 12 2 2 4-4"/></g>
    <g transform="translate(563 188)"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></g>
    <g transform="translate(658 188)"><path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/><path d="m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/><path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0"/><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5"/></g>
  </g>
  <!-- Highlighted security stages -->
  <g fill="#DBE5FB" stroke="#1D4ED8" stroke-width="1.8" stroke-linejoin="round">
    <path transform="translate(356 186) scale(1.17)" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
    <path transform="translate(359 311) scale(0.92)" d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>
  </g>
</svg>
