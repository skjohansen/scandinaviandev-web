{%- comment -%}
  Vector redraw of the Product Security Engineering illustration.
  Flow: developer → code → build servers → AI-assisted checks → threat model
  → validated → secured release, with a feedback loop back into the checks.
{%- endcomment -%}
<svg class="illustration" viewBox="0 0 800 600" role="img" aria-labelledby="ssdlc-title" xmlns="http://www.w3.org/2000/svg">
  <title id="ssdlc-title">A developer's code flows through build servers and AI-assisted security checks into a threat model, is validated, and is released through a locked security gate, with a feedback loop back into the checks</title>
  <defs>
    <pattern id="ssdlc-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#DCE3EC"/>
    </pattern>
    <marker id="ssdlc-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#1D4ED8"/>
    </marker>
    <marker id="ssdlc-arrow-grey" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#9AAAC2"/>
    </marker>
  </defs>

  <rect width="800" height="600" fill="#F6F8FB"/>
  <rect width="800" height="600" fill="url(#ssdlc-dots)" opacity="0.6"/>

  <!-- Soft ground shadows (gives the light 3D feel of the original) -->
  <g fill="#0B1930" opacity="0.06">
    <ellipse cx="110" cy="334" rx="72" ry="6"/><ellipse cx="258" cy="340" rx="44" ry="6"/>
    <ellipse cx="374" cy="328" rx="46" ry="6"/><ellipse cx="374" cy="446" rx="36" ry="5"/>
    <ellipse cx="529" cy="256" rx="90" ry="6"/><ellipse cx="711" cy="440" rx="64" ry="7"/>
  </g>

  <!-- Developer at a workstation -->
  <g stroke="#7C8FB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="74" cy="268" r="15" fill="#C9D6EA"/>
    <path d="M46 330c0-24 12-40 28-40s26 12 30 26" fill="#C9D6EA"/>
    <rect x="96" y="246" width="66" height="46" rx="4" fill="#EEF3FA"/>
    <path d="M106 258h28M106 267h40M106 276h22" stroke="#1D4ED8" stroke-width="2"/>
    <path d="M129 292v14M112 306h34M40 330h140"/>
  </g>
  <path d="M184 290h28" stroke="#9AAAC2" stroke-width="1.5" marker-end="url(#ssdlc-arrow-grey)"/>

  <!-- Code repository (stacked modules) -->
  <g fill="#EAF0F8" stroke="#7C8FB0" stroke-width="1.8" stroke-linejoin="round">
    <rect x="222" y="300" width="64" height="34" rx="4"/>
    <rect x="230" y="262" width="64" height="34" rx="4"/>
    <rect x="238" y="224" width="64" height="34" rx="4"/>
  </g>
  <g fill="none" stroke="#7C8FB0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M261 235l-6 6 6 6M279 235l6 6-6 6M273 233l-6 16"/>
    <path d="M244 279h40M236 317h28"/>
  </g>
  <path d="M300 280h26" stroke="#9AAAC2" stroke-width="1.5" marker-end="url(#ssdlc-arrow-grey)"/>

  <!-- Build servers -->
  <g fill="#F1F5FA" stroke="#7C8FB0" stroke-width="1.8">
    <rect x="336" y="232" width="76" height="26" rx="4"/>
    <rect x="336" y="264" width="76" height="26" rx="4"/>
    <rect x="336" y="296" width="76" height="26" rx="4"/>
  </g>
  <g fill="#7C8FB0">
    <circle cx="349" cy="245" r="3"/><circle cx="349" cy="277" r="3"/><circle cx="349" cy="309" r="3"/>
  </g>
  <g stroke="#B5C2D4" stroke-width="2" stroke-linecap="round">
    <path d="M362 245h38M362 277h38M362 309h38"/>
  </g>
  <path d="M384 322v28" stroke="#9AAAC2" stroke-width="1.5" marker-end="url(#ssdlc-arrow-grey)"/>

  <!-- Main blue path: code → AI checks -->
  <path d="M254 334v66a10 10 0 0 0 10 10h60" fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ssdlc-arrow)"/>

  <!-- AI-assisted checks (chip) -->
  <g stroke="#1D4ED8" stroke-width="1.8" stroke-linecap="round">
    <path d="M354 368v-8M374 368v-8M394 368v-8M354 432v8M374 432v8M394 432v8M342 380h-8M342 400h-8M342 420h-8M406 380h8M406 400h8M406 420h8"/>
  </g>
  <rect x="342" y="368" width="64" height="64" rx="6" fill="#DBE5FB" stroke="#1D4ED8" stroke-width="2"/>
  <text x="374" y="407" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" fill="#1D4ED8">AI</text>

  <!-- AI → threat model (validation) -->
  <path d="M418 390h10V180" fill="none" stroke="#9AAAC2" stroke-width="1.5" stroke-dasharray="4 4"/>
  <path d="M428 180a8 8 0 0 1 8-8h2" fill="none" stroke="#9AAAC2" stroke-width="1.5" marker-end="url(#ssdlc-arrow-grey)"/>

  <!-- AI → analysis graph -->
  <path d="M418 400h40" stroke="#9AAAC2" stroke-width="1.5" marker-end="url(#ssdlc-arrow-grey)"/>
  <g stroke="#9AAAC2" stroke-width="1.5"><path d="M486 382l30 22M516 404l30-24M516 404l-6 34M486 382l-6 40M510 438l-30-16"/></g>
  <g fill="#F1F5FA" stroke="#7C8FB0" stroke-width="1.8">
    <circle cx="486" cy="382" r="8"/><circle cx="516" cy="404" r="8"/><circle cx="546" cy="380" r="8"/><circle cx="510" cy="438" r="8"/><circle cx="480" cy="422" r="8"/>
  </g>

  <!-- Threat model panel -->
  <rect x="444" y="118" width="170" height="130" rx="8" fill="#EDF1F7" stroke="#D3DBE6" stroke-width="1.5"/>
  <g stroke="#B5C2D4" stroke-width="1.5" stroke-dasharray="3 3">
    <path d="M482 152l46-14M528 138l40 14M482 152l46 30M528 182l40-30M528 182v34M482 152v52M568 152v52"/>
  </g>
  <g fill="#E6ECF5" stroke="#7C8FB0" stroke-width="1.8" stroke-linejoin="round">
    <path d="M482 140l11 6v12l-11 6-11-6v-12z"/>
    <circle cx="528" cy="138" r="9"/>
    <rect x="519" y="173" width="18" height="18" rx="2"/>
    <circle cx="528" cy="220" r="9"/>
    <path d="M568 142l11 19h-22z"/>
    <path d="M482 194l11 19h-22z"/>
    <path d="M568 194l11 19h-22z"/>
  </g>

  <!-- Validated: graph + shield badges -->
  <g stroke="#9AAAC2" stroke-width="1.5">
    <path d="M614 160h22" marker-end="url(#ssdlc-arrow-grey)"/>
    <path d="M614 220h22" marker-end="url(#ssdlc-arrow-grey)"/>
  </g>
  <g transform="translate(646 140)">
    <path d="M20 4l16 6v12c0 11-8 17-16 20-8-3-16-9-16-20V10z" fill="#FFFFFF" stroke="#7C8FB0" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M13 22l5 5 9-10" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(646 200)">
    <path d="M20 4l16 6v12c0 11-8 17-16 20-8-3-16-9-16-20V10z" fill="#FFFFFF" stroke="#7C8FB0" stroke-width="1.8" stroke-linejoin="round"/>
    <path d="M13 22l5 5 9-10" fill="none" stroke="#1D4ED8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Threat model → release (blue) -->
  <path d="M529 248v86a10 10 0 0 0 10 10h112" fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" marker-end="url(#ssdlc-arrow)"/>

  <!-- Security gate with lock -->
  <g fill="#DCE5F2" stroke="#7C8FB0" stroke-width="1.8" stroke-linejoin="round">
    <rect x="664" y="292" width="18" height="140" rx="2"/>
    <rect x="740" y="292" width="18" height="140" rx="2"/>
    <rect x="656" y="280" width="110" height="16" rx="3"/>
  </g>
  <path d="M664 432h94" stroke="#7C8FB0" stroke-width="1.8"/>
  <path d="M700 352v-12a11 11 0 0 1 22 0v12" fill="none" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>
  <rect x="692" y="350" width="38" height="32" rx="5" fill="#1D4ED8"/>
  <circle cx="711" cy="363" r="4" fill="#FFFFFF"/>
  <path d="M711 366v7" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>

  <!-- Feedback loop: release back into checks -->
  <path d="M711 432v62a8 8 0 0 1-8 8H392a8 8 0 0 1-8-8v-44" fill="none" stroke="#9AAAC2" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ssdlc-arrow-grey)"/>
</svg>
