- key: preventive-cybersecurity
  title: "Preventive Cybersecurity"
  tagline: "Prevention over firefighting — Zero Trust architecture, Security by Design and threat modeling"
  short: "Security architecture, Security by Design, threat modeling and Zero Trust implementation."
  icon: "🛡️"
  color: "#FEE2E2"
  pillar: cybersecurity
  image_placeholder: "Image: Zero Trust architecture diagram"
  highlights:
    - value: "60-80%"
      label: "Cheaper than remediation"
    - value: "<5 min"
      label: "Mean Time to Detect"
    - value: "<5%"
      label: "Blast radius in attacks"
  about_title: "What is Preventive Cybersecurity?"
  about_body: |
    Preventive cybersecurity is about building security in from the start — not as an afterthought, but as a fundamental part of your architecture and processes.

    Our approach is based on the **Zero Trust principle**: *"Never Trust, Always Verify"*. We design security architecture that protects throughout the entire Cyber Kill Chain — from reconnaissance to data exfiltration.

    By focusing on prevention rather than reaction, we significantly reduce both risk and costs.
  sections:
    - title: "Our Approach"
      intro: "We work systematically with security across the entire Cyber Kill Chain."
      items:
        - title: "Zero Trust Architecture"
          description: "Micro-segmentation, identity verification and least-privilege access for all users and systems."
        - title: "Security by Design"
          description: "Security integrated from requirements to deployment — not as an extra layer, but as part of the foundation."
        - title: "Threat Modeling"
          description: "Structured threat identification using STRIDE, PASTA and our ZT-Kipling methodology."
    - title: "Defense through the Cyber Kill Chain"
      items:
        - title: "Reconnaissance"
          description: "Minimal digital footprint and attack surface reduction."
        - title: "Vulnerability Management"
          description: "Proactive identification and closure of vulnerabilities before they are exploited."
        - title: "Network Segmentation"
          description: "Micro-segmentation and isolation that limits lateral movement."
        - title: "Continuous Monitoring"
          description: "Real-time detection with whitelisting and anomaly-based monitoring."
        - title: "Data Protection"
          description: "Encryption, DLP and strong access control for sensitive data."
        - title: "Incident Response"
          description: "Well-defined processes for rapid response and damage minimization."

- key: ai-security
  title: "AI Security"
  tagline: "Protect your AI initiatives — governance, compliance and Zero Trust for artificial intelligence"
  short: "AI Governance, EU AI Act compliance, data security and Zero Trust for AI systems."
  icon: "🤖"
  color: "#DBEAFE"
  pillar: cybersecurity
  image_placeholder: "Image: AI Governance framework"
  highlights:
    - value: "40%"
      label: "See data leakage via GenAI as top risk"
    - value: "50%"
      label: "Want secure AI enablement"
    - value: "EU AI Act"
      label: "Compliance-ready"
  about_title: "What is AI Security?"
  about_body: |
    AI adoption is accelerating, but security risks are growing in tandem. We help organizations implement AI responsibly and securely.

    Our approach covers the full spectrum from **AI Governance Framework design** to **EU AI Act compliance** and **Zero Trust for AI** — including input validation, access control and output monitoring.

    We help you balance innovation and security so you can leverage AI's potential without compromising your security posture.
  sections:
    - title: "Key Areas"
      items:
        - title: "AI Governance Framework"
          description: "Design and implementation of governance structures for responsible AI use across the organization."
        - title: "EU AI Act Compliance"
          description: "Risk classification, Fundamental Rights Impact Assessment (FRIA) and DPIA for AI systems."
        - title: "Data Classification & Security"
          description: "Systematic classification and protection of data used for AI training and inference."
        - title: "Zero Trust for AI"
          description: "Input validation, access control, output monitoring and prompt injection protection."
        - title: "AI in Security Operations"
          description: "Secure integration of AI tools into existing security infrastructure."
        - title: "Compliance Integration"
          description: "Interplay between AI Act, NIS2, GDPR and ISO 27001 for holistic compliance."

- key: generative-ai-security-tool
