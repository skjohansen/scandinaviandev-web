  color: "#FEF3C7"
  pillar: software
  image_placeholder: "Image: AI-assisted security analysis"
  highlights:
    - value: "50-70%"
      label: "Reduction in documentation time"
    - value: "Force Multiplier"
      label: "For security teams"
    - value: "GenAI + Security"
      label: "Unique combination"
  about_title: "What is Generative AI as Security Tool?"
  about_body: |
    Generative AI is a game-changer for security teams. We help organizations use AI as a **force multiplier** — not as a replacement for expertise, but as an amplifier.

    Few combine GenAI and security with this depth. Our approach democratizes security knowledge and reduces documentation time by 50-70%.
  sections:
    - title: "Application Areas"
      items:
        - title: "Threat Modeling with AI"
          description: "Automated threat identification, scenario generation and attack trees with AI assistance."
        - title: "GRC & Compliance"
          description: "AI-assisted policy generation, gap analysis and control mapping across ISO 27001, NIS2 and CRA."
        - title: "DevSecOps"
          description: "Intelligent code review, fix suggestions and automated security integration in CI/CD pipelines."
        - title: "Security Culture"
