- key: grc-and-compliance
  title: "GRC & Compliance Advisory"
  tagline: "Compliance as byproduct — ISO 27001, NIS2, CRA, GDPR and AI Act"
  short: "ISO 27001/9001 certification, NIS2, CRA, GDPR, AI Act and ongoing compliance advisory."
  icon: "📋"
  color: "#E0E7FF"
  pillar: leadership
  image_placeholder: "Image: Compliance framework overview"
  highlights:
    - value: "ISO 27001"
      label: "Certification expertise"
    - value: "NIS2"
      label: "Compliance-ready"
    - value: "5+"
      label: "Regulatory frameworks"
  about_title: "What is GRC & Compliance Advisory?"
  about_body: |
    Our philosophy is simple: **"Compliance as byproduct"** — when security is right, compliance follows naturally.

    We help organizations navigate the complex regulatory landscape, from ISO 27001 certification to NIS2 compliance and AI Act preparation.

    NIS2 deadlines create urgent demand, and CRA hits software producers hard. We ensure you are prepared.
  sections:
    - title: "Regulatory Frameworks"
      items:
        - title: "ISO 27001 / 9001"
          description: "Full implementation and certification support for information security and quality management."
        - title: "NIS2 Directive"
          description: "Compliance for critical infrastructure and important sectors — risk assessment, reporting and governance."
        - title: "Cyber Resilience Act (CRA)"
          description: "Requirements for software producers regarding security throughout the product lifecycle."
        - title: "AI Act"
          description: "Risk classification, conformity assessment and governance for AI systems."
        - title: "GDPR"
          description: "Data protection, DPIA and integrated privacy-by-design approach."
        - title: "Ongoing Compliance"
          description: "Continuous monitoring, audit preparation and compliance-as-a-service."
