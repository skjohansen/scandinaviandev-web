  color: "#FEF3C7"
  pillar: software
  image_placeholder: "Billede: AI-assisteret sikkerhedsanalyse"
  highlights:
    - value: "50-70%"
      label: "Reduktion i dokumentationstid"
    - value: "Force Multiplier"
