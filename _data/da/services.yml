    - value: "GenAI + Sikkerhed"
      label: "Unik kombination"
  about_title: "Hvad er Generativ AI som Sikkerhedsværktøj?"
  about_body: |
    Generativ AI er en game-changer for sikkerhedsteams. Vi hjælper organisationer med at bruge AI som en **force multiplier** — ikke som erstatning for ekspertise, men som forstærkning af den.

    Få kombinerer GenAI og sikkerhed med denne dybde. Vores tilgang demokratiserer sikkerhedsviden og reducerer dokumentationstid med 50-70%.
  sections:
    - title: "Anvendelsesområder"
      items:
        - title: "Trusselsmodellering med AI"
          description: "Automatiseret trusselsidentifikation, scenariegenerering og angrebstræer med AI-assistance."
        - title: "GRC & Compliance"
          description: "AI-assisteret policygenerering, gap-analyse og kontrolmapping på tværs af ISO 27001, NIS2 og CRA."
        - title: "DevSecOps"
          description: "Intelligent kodegennemgang, fix-forslag og automatiseret sikkerhedsintegration i CI/CD-pipelines."
        - title: "Sikkerhedskultur"
          description: "Personaliseret træning, phishing-simulering og risikokommunikation drevet af AI."
        - title: "Dokumentation"
          description: "Automatiseret generering af sikkerhedsdokumentation, politikker og procedurer."
        - title: "Incident Analyse"
          description: "AI-assisteret analyse af sikkerhedshændelser og automatiseret rapportgenerering."

- key: grc-og-compliance
  title: "GRC & Compliance Rådgivning"
  tagline: "Compliance som biprodukt — ISO 27001, NIS2, CRA, GDPR og AI Act"
  short: "ISO 27001/9001 certificering, NIS2, CRA, GDPR, AI Act og løbende compliance-rådgivning."
  icon: "📋"
  color: "#E0E7FF"
  pillar: leadership
  image_placeholder: "Billede: Compliance framework oversigt"
  highlights:
    - value: "ISO 27001"
      label: "Certificeringsekspertise"
    - value: "NIS2"
      label: "Compliance-klar"
    - value: "5+"
      label: "Regulatoriske frameworks"
  about_title: "Hvad er GRC & Compliance Rådgivning?"
  about_body: |
    Vores filosofi er enkel: **"Compliance som biprodukt"** — når sikkerheden er rigtig, følger compliance naturligt.

    Vi hjælper organisationer med at navigere det komplekse regulatoriske landskab, fra ISO 27001-certificering til NIS2-compliance og AI Act-forberedelse.

    NIS2-deadlines skaber akut efterspørgsel, og CRA rammer softwareproducenter hårdt. Vi sikrer, at I er forberedt.
  sections:
    - title: "Regulatoriske frameworks"
      items:
        - title: "ISO 27001 / 9001"
          description: "Fuld implementering og certificeringsstøtte for informationssikkerhed og kvalitetsstyring."
        - title: "NIS2 Direktivet"
          description: "Compliance for kritisk infrastruktur og vigtige sektorer — risikovurdering, rapportering og governance."
        - title: "Cyber Resilience Act (CRA)"
          description: "Krav til softwareproducenter om sikkerhed i hele produktlivscyklussen."
        - title: "AI Act"
          description: "Risikoklassificering, conformity assessment og governance for AI-systemer."
        - title: "GDPR"
          description: "Databeskyttelse, DPIA og integreret privacy-by-design tilgang."
        - title: "Løbende Compliance"
          description: "Kontinuerlig overvågning, audit-forberedelse og compliance-som-service."
