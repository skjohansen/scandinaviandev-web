- key: preventiv-cybersikkerhed
  title: "Preventiv Cybersikkerhed"
  tagline: "Forebyggelse frem for brandslukning — Zero Trust arkitektur, Security by Design og trusselsmodellering"
  short: "Sikkerhedsarkitektur, Security by Design, trusselsmodellering og Zero Trust implementering."
  icon: "🛡️"
  color: "#FEE2E2"
  pillar: cybersecurity
  image_placeholder: "Billede: Zero Trust arkitektur-diagram"
  highlights:
    - value: "60-80%"
      label: "Billigere end remediation"
    - value: "<5 min"
      label: "Mean Time to Detect"
    - value: "<5%"
      label: "Blast radius ved angreb"
  about_title: "Hvad er Preventiv Cybersikkerhed?"
  about_body: |
    Preventiv cybersikkerhed handler om at bygge sikkerhed ind fra start — ikke som eftertanke, men som en fundamental del af jeres arkitektur og processer.

    Vores tilgang er baseret på **Zero Trust-princippet**: *"Never Trust, Always Verify"*. Vi designer sikkerhedsarkitektur der beskytter gennem hele Cyber Kill Chain — fra rekognoscering til dataeksfiltrering.

    Ved at fokusere på forebyggelse fremfor reaktion, reducerer vi både risiko og omkostninger markant.
  sections:
    - title: "Vores tilgang"
      intro: "Vi arbejder systematisk med sikkerhed på tværs af hele Cyber Kill Chain."
      items:
        - title: "Zero Trust Arkitektur"
          description: "Mikro-segmentering, identitetsverifikation og mindste-privilegium adgang for alle brugere og systemer."
        - title: "Security by Design"
          description: "Sikkerhed integreret fra kravspecifikation til deployment — ikke som et ekstra lag, men som en del af fundamentet."
        - title: "Trusselsmodellering"
          description: "Struktureret identifikation af trusler med STRIDE, PASTA og vores ZT-Kipling metodologi."
    - title: "Forsvar gennem Cyber Kill Chain"
      items:
        - title: "Rekognoscering"
          description: "Minimalt digitalt fodaftryk og reduktion af angrebsoverfladen."
        - title: "Sårbarhedshåndtering"
          description: "Proaktiv identificering og lukning af sårbarheder før de udnyttes."
        - title: "Netværkssegmentering"
          description: "Mikro-segmentering og isolation der begrænser lateral bevægelse."
        - title: "Kontinuerlig overvågning"
          description: "Real-time detektion med whitelisting og anomalibaseret monitoring."
        - title: "Databeskyttelse"
          description: "Kryptering, DLP og stærk adgangskontrol for følsomme data."
        - title: "Incident Response"
          description: "Veldefinerede processer for hurtig reaktion og minimering af skade."

- key: ai-sikkerhed
  title: "AI Sikkerhed"
  tagline: "Beskyt jeres AI-initiativer — governance, compliance og Zero Trust for kunstig intelligens"
  short: "AI Governance, EU AI Act compliance, datasikkerhed og Zero Trust for AI-systemer."
  icon: "🤖"
  color: "#DBEAFE"
  pillar: cybersecurity
  image_placeholder: "Billede: AI Governance framework"
  highlights:
    - value: "40%"
      label: "Ser datalækage via GenAI som toprisiko"
    - value: "50%"
      label: "Ønsker sikker AI-enablement"
    - value: "EU AI Act"
      label: "Compliance-klar"
  about_title: "Hvad er AI Sikkerhed?"
  about_body: |
    AI-adoption accelererer, men sikkerhedsrisiciene vokser i takt. Vi hjælper organisationer med at implementere AI ansvarligt og sikkert.

    Vores tilgang dækker hele spektret fra **AI Governance Framework-design** til **EU AI Act compliance** og **Zero Trust for AI** — herunder input-validering, adgangskontrol og output-overvågning.

    Vi hjælper jer med at balancere innovation og sikkerhed, så I kan udnytte AI's potentiale uden at kompromittere jeres sikkerhed.
  sections:
    - title: "Nøgleområder"
      items:
        - title: "AI Governance Framework"
          description: "Design og implementering af governance-strukturer for ansvarlig AI-brug på tværs af organisationen."
        - title: "EU AI Act Compliance"
          description: "Risikoklassificering, Fundamental Rights Impact Assessment (FRIA) og DPIA for AI-systemer."
        - title: "Data Klassificering & Sikkerhed"
          description: "Systematisk klassificering og beskyttelse af data der bruges til AI-træning og -inferens."
        - title: "Zero Trust for AI"
          description: "Input-validering, adgangskontrol, output-overvågning og prompt injection-beskyttelse."
        - title: "AI i Sikkerhedsoperationer"
          description: "Sikker integration af AI-værktøjer i eksisterende sikkerhedsinfrastruktur."
        - title: "Compliance-integration"
          description: "Samspil mellem AI Act, NIS2, GDPR og ISO 27001 for helhedsorienteret compliance."

- key: generativ-ai-som-sikkerhedsvaerktoej
  title: "Generativ AI som Sikkerhedsværktøj"
  tagline: "AI som force multiplier for sikkerhedsteams — trusselsanalyse, compliance og DevSecOps"
  short: "AI-assisteret sikkerhedsarbejde, trusselsanalyse, compliance-dokumentation og DevSecOps."
