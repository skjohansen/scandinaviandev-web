<!DOCTYPE html>
<html lang="{{ page.lang | default: 'da' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {% if page.alternate %}
  {% for alt in page.alternate %}
  <link rel="alternate" hreflang="{{ alt[0] }}" href="{{ alt[1] | relative_url }}">
  {% endfor %}
  {% endif %}
</head>
<body>
  {% include header.html %}
  <main>
    {{ content }}
  </main>
  {% include footer.html %}
  <script>
    // Mobile nav toggle
    document.addEventListener('DOMContentLoaded', function() {
      var toggle = document.querySelector('.nav__toggle');
      var mobile = document.querySelector('.nav__mobile');
      if (toggle && mobile) {
        toggle.addEventListener('click', function() {
          mobile.classList.toggle('is-open');
        });
      }
      // Language switcher toggle
      var langBtn = document.querySelector('.lang-switcher__btn');
      var langDrop = document.querySelector('.lang-switcher__dropdown');
      if (langBtn && langDrop) {
        langBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          langDrop.classList.toggle('is-open');
        });
        document.addEventListener('click', function() {
          langDrop.classList.remove('is-open');
        });
      }
    });
  </script>
</body>
</html>
