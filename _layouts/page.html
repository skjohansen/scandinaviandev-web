---
layout: default
---

{% assign strings = site.data[page.lang].strings %}

<section class="hero hero--sub">
  <div class="container">
    <div class="hero__content">
      {% if page.page_label %}<span class="hero__label">{{ page.page_label }}</span>{% endif %}
      <h1>{{ page.title }}</h1>
      {% if page.subtitle %}<p>{{ page.subtitle }}</p>{% endif %}
    </div>
  </div>
</section>

{{ content }}
